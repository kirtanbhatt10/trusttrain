[project]
name = "trusttrain-backend"
version = "0.1.0"
description = "TrustTrain API: AI training supply chain security"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient warns about its httpx transport; unrelated to TrustTrain code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert is used for type narrowing and in tests
    "RUF001", # intentional Unicode characters (e.g. →, ≥) in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
# Seeded PRNGs are required for reproducible experiments; they are never used for security.
"app/evaluation/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests/", "alembic/"]

[tool.bandit]
exclude_dirs = ["tests"]
